name: Publish container

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Check oracles
        run: bash scripts/check-oracles.sh
      - name: Image tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.description=4get metasearch with restored oracles
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test built image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --rm --entrypoint php "$IMAGE:latest" tests/oracles.php
          docker run --rm "$IMAGE:latest" httpd -t
      - name: Publish image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:latest"
          echo "Published \`$IMAGE:latest\` and \`$IMAGE:sha-$REVISION\`" >> "$GITHUB_STEP_SUMMARY"
